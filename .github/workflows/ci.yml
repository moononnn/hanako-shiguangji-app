name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      # 本地开发机在 UTC+8，日期与生活日相关的断言跟时区绑着；跑 UTC 会挂。
      TZ: Asia/Shanghai
      # 测试跑在隔离的数据目录里，不碰 runner 上的用户目录。
      HANA_HOME: ${{ runner.temp }}\hana-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 准备隔离目录
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:HANA_HOME -Force | Out-Null

      - name: 语法检查
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $files = @('index.js')
          foreach ($dir in @('lib', 'routes', 'tools', 'extensions', 'assets', 'tests')) {
            if (Test-Path $dir) {
              $files += Get-ChildItem $dir -Recurse -Filter *.js -File |
                ForEach-Object { $_.FullName.Substring($root.Length + 1) }
            }
          }
          Write-Host "共 $($files.Count) 个文件"
          foreach ($f in $files) {
            node --check $f
            if ($LASTEXITCODE -ne 0) { throw "语法检查失败：$f" }
          }

      - name: 全量测试
        shell: pwsh
        # 不给名单：Node 自己递归找（tests/ 顶层 31 个 + lib/update-checker/tests/ 2 个）。
        # 显式列 tests/*.test.js 会漏掉积木自带的那两个文件（差 60 条用例）。
        run: node --test
